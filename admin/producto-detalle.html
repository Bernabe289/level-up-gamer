<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Detalle del producto - Panel Admin - Level-Up Gamer</title>

    <link
        rel="stylesheet"
        href="../assets/css/admin.css">
</head>

<body>

    <div class="admin-layout">

        <aside class="admin-menu">

            <a
                href="index.html"
                class="admin-logo">

                <span>LEVEL-UP</span>
                <small>ADMIN</small>

            </a>


            <nav class="admin-nav">

                <a href="index.html">
                    Inicio
                </a>

                <a
                    href="productos.html"
                    class="activo">

                    Productos

                </a>

                <a href="usuarios.html">
                    Usuarios
                </a>

            </nav>


            <a
                href="../index.html"
                class="admin-volver">

                ← Volver a la tienda

            </a>

        </aside>


        <main class="admin-contenido">

            <div class="admin-encabezado admin-encabezado-fila">

                <div>

                    <p class="admin-etiqueta">
                        DETALLE DEL PRODUCTO
                    </p>

                    <h1 id="admin-detalle-nombre">
                        Producto
                    </h1>

                </div>


                <a
                    id="admin-detalle-editar"
                    href="productos.html"
                    class="admin-boton">

                    Editar

                </a>

            </div>


            <div class="admin-detalle">

                <div class="admin-detalle-imagen">

                    <img
                        id="admin-detalle-imagen"
                        src=""
                        alt="Imagen del producto">

                </div>


                <div class="admin-detalle-info">

                    <p class="admin-detalle-dato">

                        <span>
                            Código
                        </span>

                        <strong id="admin-detalle-codigo">
                        </strong>

                    </p>


                    <p class="admin-detalle-dato">

                        <span>
                            Categoría
                        </span>

                        <strong id="admin-detalle-categoria">
                        </strong>

                    </p>


                    <p class="admin-detalle-dato">

                        <span>
                            Fabricante
                        </span>

                        <strong id="admin-detalle-fabricante">
                        </strong>

                    </p>


                    <p class="admin-detalle-dato">

                        <span>
                            Precio
                        </span>

                        <strong id="admin-detalle-precio">
                        </strong>

                    </p>


                    <p class="admin-detalle-dato">

                        <span>
                            Stock
                        </span>

                        <strong id="admin-detalle-stock">
                        </strong>

                    </p>


                    <p class="admin-detalle-dato">

                        <span>
                            Stock crítico
                        </span>

                        <strong id="admin-detalle-stock-critico">
                        </strong>

                    </p>


                    <p
                        class="admin-detalle-descripcion"
                        id="admin-detalle-descripcion">
                    </p>


                    <p
                        class="admin-alerta-critico"
                        id="admin-detalle-alerta">
                    </p>

                </div>

            </div>

        </main>

    </div>


    <script src="../assets/js/productos.js"></script>
    <script src="../assets/js/admin.js"></script>

</body>

</html>
