<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Nuevo producto - Panel Admin - Level-Up Gamer</title>

    <link
        rel="stylesheet"
        href="../assets/css/admin.css">
</head>

<body>

    <div class="admin-layout">

        <aside class="admin-menu">

            <a
                href="index.html"
                class="admin-logo">

                <span>LEVEL-UP</span>
                <small>ADMIN</small>

            </a>


            <nav class="admin-nav">

                <a href="index.html">
                    Inicio
                </a>

                <a
                    href="productos.html"
                    class="activo">

                    Productos

                </a>

                <a href="usuarios.html">
                    Usuarios
                </a>

            </nav>


            <a
                href="../index.html"
                class="admin-volver">

                ← Volver a la tienda

            </a>

        </aside>


        <main class="admin-contenido">

            <div class="admin-encabezado">

                <p class="admin-etiqueta">
                    NUEVO PRODUCTO
                </p>

                <h1>
                    Agregar producto
                </h1>

            </div>


            <form
                id="form-producto-nuevo"
                class="admin-form"
                novalidate>


                <div class="admin-form-grid">


                    <div class="admin-campo">

                        <label for="codigo">
                            Código
                        </label>

                        <input
                            type="text"
                            id="codigo"
                            minlength="3">

                        <p
                            class="admin-error"
                            id="error-codigo">
                        </p>

                    </div>


                    <div class="admin-campo">

                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            maxlength="100">

                        <p
                            class="admin-error"
                            id="error-nombre">
                        </p>

                    </div>


                    <div class="admin-campo">

                        <label for="categoria">
                            Categoría
                        </label>

                        <select id="categoria">

                            <option value="">
                                Selecciona una categoría
                            </option>

                            <option value="Juegos de Mesa">
                                Juegos de Mesa
                            </option>

                            <option value="Accesorios">
                                Accesorios
                            </option>

                            <option value="Consolas">
                                Consolas
                            </option>

                            <option value="Computadores Gamers">
                                Computadores Gamers
                            </option>

                            <option value="Sillas Gamers">
                                Sillas Gamers
                            </option>

                            <option value="Mouse">
                                Mouse
                            </option>

                            <option value="Mousepad">
                                Mousepad
                            </option>

                            <option value="Poleras Personalizadas">
                                Poleras Personalizadas
                            </option>

                        </select>

                        <p
                            class="admin-error"
                            id="error-categoria">
                        </p>

                    </div>


                    <div class="admin-campo">

                        <label for="fabricante">
                            Fabricante
                        </label>

                        <input
                            type="text"
                            id="fabricante"
                            maxlength="100">

                        <p
                            class="admin-error"
                            id="error-fabricante">
                        </p>

                    </div>


                    <div class="admin-campo">

                        <label for="precio">
                            Precio
                        </label>

                        <input
                            type="number"
                            id="precio"
                            min="0"
                            step="0.01">

                        <p
                            class="admin-error"
                            id="error-precio">
                        </p>

                    </div>


                    <div class="admin-campo">

                        <label for="stock">
                            Stock
                        </label>

                        <input
                            type="number"
                            id="stock"
                            min="0"
                            step="1">

                        <p
                            class="admin-error"
                            id="error-stock">
                        </p>

                    </div>


                    <div class="admin-campo">

                        <label for="stock-critico">
                            Stock crítico
                        </label>

                        <input
                            type="number"
                            id="stock-critico"
                            min="0"
                            step="1">

                        <small>
                            Opcional. Si el stock llega a este número o menos,
                            se marca como crítico.
                        </small>

                        <p
                            class="admin-error"
                            id="error-stock-critico">
                        </p>

                    </div>


                    <div class="admin-campo">

                        <label for="imagen">
                            Imagen
                        </label>

                        <input
                            type="text"
                            id="imagen"
                            placeholder="assets/img/nombre.jpg">

                        <small>
                            Opcional. Ruta de la imagen del proyecto.
                            Si lo dejas vacío se usa una imagen genérica.
                        </small>

                    </div>


                    <div class="admin-campo admin-campo-completo">

                        <label for="descripcion">
                            Descripción
                        </label>

                        <textarea
                            id="descripcion"
                            maxlength="500"
                            rows="4">
                        </textarea>

                        <p
                            class="admin-error"
                            id="error-descripcion">
                        </p>

                    </div>

                </div>


                <div class="admin-form-acciones">

                    <button
                        type="submit"
                        class="admin-boton">

                        Guardar producto

                    </button>

                    <a
                        href="productos.html"
                        class="admin-cancelar">

                        Cancelar

                    </a>

                </div>


                <p
                    id="producto-exitoso"
                    class="admin-exitoso">
                </p>

            </form>

        </main>

    </div>


    <script src="../assets/js/productos.js"></script>
    <script src="../assets/js/admin.js"></script>

</body>

</html>
