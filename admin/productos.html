<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Productos - Panel Admin - Level-Up Gamer</title>

    <link
        rel="stylesheet"
        href="../assets/css/admin.css">
</head>

<body>

    <div class="admin-layout">

        <aside class="admin-menu">

            <a
                href="index.html"
                class="admin-logo">

                <span>LEVEL-UP</span>
                <small>ADMIN</small>

            </a>


            <nav class="admin-nav">

                <a href="index.html">
                    Inicio
                </a>

                <a
                    href="productos.html"
                    class="activo">

                    Productos

                </a>

                <a href="usuarios.html">
                    Usuarios
                </a>

            </nav>


            <a
                href="../index.html"
                class="admin-volver">

                ← Volver a la tienda

            </a>

        </aside>


        <main class="admin-contenido">

            <div class="admin-encabezado admin-encabezado-fila">

                <div>

                    <p class="admin-etiqueta">
                        GESTIÓN DE PRODUCTOS
                    </p>

                    <h1>
                        Productos
                    </h1>

                </div>


                <a
                    href="producto-nuevo.html"
                    class="admin-boton">

                    + Nuevo producto

                </a>

            </div>


            <div class="admin-tabla-contenedor">

                <table class="admin-tabla">

                    <thead>

                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>


                    <tbody id="lista-productos-admin">
                    </tbody>

                </table>

            </div>

        </main>

    </div>


    <script src="../assets/js/productos.js"></script>
    <script src="../assets/js/admin.js"></script>

</body>

</html>
