<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Detalle usuario - Panel Admin - Level-Up Gamer</title>

    <link
        rel="stylesheet"
        href="../assets/css/admin.css">
</head>

<body>

    <div class="admin-layout">

        <aside class="admin-menu">

            <a
                href="index.html"
                class="admin-logo">

                <span>LEVEL-UP</span>
                <small>ADMIN</small>

            </a>


            <nav class="admin-nav">

                <a href="index.html">
                    Inicio
                </a>

                <a href="productos.html">
                    Productos
                </a>

                <a
                    href="usuarios.html"
                    class="activo">

                    Usuarios

                </a>

            </nav>


            <a
                href="../index.html"
                class="admin-volver">

                ← Volver a la tienda

            </a>

        </aside>


        <main class="admin-contenido">

            <div class="admin-encabezado">

                <p class="admin-etiqueta">
                    DETALLE DE USUARIO
                </p>

                <h1>
                    Información del usuario
                </h1>

                <p>
                    Datos de la cuenta seleccionada.
                </p>

            </div>


            <div
                id="detalle-usuario"
                class="admin-form">


                <div class="admin-detalle-dato">

                    <strong>RUN</strong>

                    <span id="detalle-run">
                        -
                    </span>

                </div>


                <div class="admin-detalle-dato">

                    <strong>Nombre</strong>

                    <span id="detalle-nombre">
                        -
                    </span>

                </div>


                <div class="admin-detalle-dato">

                    <strong>Apellidos</strong>

                    <span id="detalle-apellidos">
                        -
                    </span>

                </div>


                <div class="admin-detalle-dato">

                    <strong>Correo electrónico</strong>

                    <span id="detalle-correo">
                        -
                    </span>

                </div>


                <div class="admin-detalle-dato">

                    <strong>Fecha de nacimiento</strong>

                    <span id="detalle-fecha">
                        -
                    </span>

                </div>


                <div class="admin-detalle-dato">

                    <strong>Tipo de usuario</strong>

                    <span id="detalle-tipo">
                        -
                    </span>

                </div>


                <div class="admin-detalle-dato">

                    <strong>Región</strong>

                    <span id="detalle-region">
                        -
                    </span>

                </div>


                <div class="admin-detalle-dato">

                    <strong>Comuna</strong>

                    <span id="detalle-comuna">
                        -
                    </span>

                </div>


                <div class="admin-detalle-dato">

                    <strong>Dirección</strong>

                    <span id="detalle-direccion">
                        -
                    </span>

                </div>


                <div class="admin-form-acciones">

                    <a
                        id="boton-editar-detalle"
                        href="#"
                        class="admin-boton">

                        Editar usuario

                    </a>


                    <a
                        href="usuarios.html"
                        class="admin-cancelar">

                        Volver

                    </a>

                </div>

            </div>

        </main>

    </div>


    <script src="../assets/js/admin.js"></script>

</body>

</html>
